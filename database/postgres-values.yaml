# PostgreSQL Helm Chart Values
# This file provides a starting point for configuring PostgreSQL
# Candidates should customize these values for their deployment

# Global settings
global:
  postgresql:
    auth:
      username: "axonuser"
      database: "axon_vulnerable_app"
      existingSecret: "postgresql-auth" # add
      secretKeys: # added k8s secrets in the devsecops-homelab/secrets directory
        adminPasswordKey: "postgres-password"
        userPasswordKey: "password"

# Primary configuration
primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "gp2"
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Health checks
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
  
  # Old Security context
  # securityContext:
  #   enabled: true
  #   runAsUser: 1001
  #   runAsGroup: 1001
  #   fsGroup: 1001

  # Pod level security context added
  podSecurityContext:
    enabled: true
    fsGroup: 1001

  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Service configuration
  service:
    type: ClusterIP
    ports:
      postgresql: 5432

# Network policies (optional)
  networkPolicy:
    enabled: true

# Monitoring (optional)
metrics:
  enabled: true
